name: rwkv-7-minipile reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # artifact upload

host_preflight:
  command: |
    set -eu
    pwd
    test -d "$PWD/.git"
    test -x /bin/bash
    readlink -f /bin/bash
    id
    df -h "$PWD" /opt
    df -hi "$PWD" /opt
    free -m
    ulimit -a
    env | sed 's/=.*//' | sort
  trace: off

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    rm -rf *.egg-info src/*.egg-info
    if command -v uv >/dev/null 2>&1; then
      test "$(uv --version | awk '{print $1, $2}')" = "uv 0.12.3"
      echo UV_SOURCE=baked
    else
      curl -fsSL -o /tmp/uv-campaign.tar.gz \
        https://github.com/astral-sh/uv/releases/download/0.12.3/uv-x86_64-unknown-linux-gnu.tar.gz
      echo "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101  /tmp/uv-campaign.tar.gz" | sha256sum -c -
      tar -xzf /tmp/uv-campaign.tar.gz -C /tmp
      sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
      test "$(/usr/local/bin/uv --version | awk '{print $1, $2}')" = "uv 0.12.3"
      echo UV_SOURCE=bootstrapped
    fi
    curl -sS -o /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl --create-dirs "https://test-files.pythonhosted.org/packages/61/98/f7925c6aeba591de9e490bc2b070737e17b5ed948b2cb05ef8b86730537a/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl"
    echo "7f5321965766eb27462b2931b7961eaf48742109a74f5aa5194a4ba9492f988a  /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl" | sha256sum -c -
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # huggingface-hub is required for the publish step's hf:// upload.
    uv tool install --python 3.12.10 --force --with huggingface-hub /tmp/roar_wheel/roar_cli-0.4.4rc7-cp310-abi3-manylinux_2_34_x86_64.whl
    sudo ln -sf /root/.local/bin/roar /usr/local/bin/roar
    test "$(env PATH=/usr/local/bin:/usr/bin:/bin roar --version)" = "roar, version 0.4.4rc7"
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc7" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    test "$(ls /usr/local/bin/../lib/python3.10/dist-packages/roar/bin 2>/dev/null | wc -l)" != "0" || \
      test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    /usr/local/bin/uv venv --python /opt/pytorch/bin/python /opt/row018-venv
    test -f /opt/row018-venv/pyvenv.cfg
    grep -qx 'include-system-site-packages = false' /opt/row018-venv/pyvenv.cfg
    /usr/local/bin/uv pip install --python /opt/row018-venv/bin/python torch==2.7.1 pytorch-lightning==1.9.5 deepspeed==0.17.2 ninja==1.11.1.4 numpy==1.26.4 torchmetrics==0.11.4 wandb==0.21.0 setuptools==69.5.1
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

fetch-data:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row018-venv/bin:$PATH

    export PYTHONUNBUFFERED=1
    roar run -n fetch-data -- python -c "import pathlib,urllib.request; d=pathlib.Path(\"RWKV-v7/train_temp/data\"); d.mkdir(parents=True,exist_ok=True); urllib.request.urlretrieve(\"https://huggingface.co/datasets/BlinkDL/minipile-tokenized/resolve/main/rwkv_vocab_v20230424/minipile.idx\",d/\"minipile.idx\"); urllib.request.urlretrieve(\"https://huggingface.co/datasets/BlinkDL/minipile-tokenized/resolve/main/rwkv_vocab_v20230424/minipile.bin\",d/\"minipile.bin\")"
  trace: off

initialize:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row018-venv/bin:$PATH

    export PYTHONUNBUFFERED=1
    roar run -n initialize -- sh -c 'cd RWKV-v7/train_temp && exec python train.py --wandb "" --proj_dir out/L12-D768-x070 --data_file data/minipile --data_type binidx --vocab_size 65536 --my_testing x070 --ctx_len 512 --train_stage 1 --epoch_count 1 --epoch_begin 0 --epoch_save 1 --weight_decay 0 --head_size 64 --num_nodes 1 --micro_bsz 1 --n_layer 12 --n_embd 768 --my_exit_tokens 1498226207 --magic_prime 2926181 --lr_init 1e-5 --lr_final 1e-5 --warmup_steps 10 --beta1 0.9 --beta2 0.99 --adam_eps 1e-8 --accelerator cpu --devices 1 --precision bf16 --strategy deepspeed_stage_2 --grad_cp 1'
  trace: off

train:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/row018-venv/bin:$PATH

    export PYTHONUNBUFFERED=1
    roar run -n train -- sh -c 'cd RWKV-v7/train_temp && exec python train.py --load_model 0 --wandb "" --proj_dir out/L12-D768-x070 --my_testing x070 --ctx_len 512 --train_stage 3 --epoch_count 999999 --epoch_begin 0 --data_file data/minipile --my_exit_tokens 20643840 --magic_prime 2926181 --num_nodes 1 --micro_bsz 16 --n_layer 12 --n_embd 768 --kernel @rwkv3 --lr_init 6e-4 --lr_final 6e-5 --warmup_steps 10 --beta1 0.9 --beta2 0.99 --adam_eps 1e-18 --data_type binidx --vocab_size 65536 --weight_decay 0.001 --epoch_save 10 --head_size 64 --head_chunk 0 --accelerator gpu --devices 1 --precision bf16 --strategy deepspeed_stage_2 --grad_cp 1 --enable_progress_bar True'
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact RWKV-v7/train_temp/out/L12-D768-x070/rwkv-final.pth model.name=rwkv-7-minipile model.version=x070-rc4a license.id=Apache-2.0 license.name='Apache License 2.0' description='RWKV-7 x070 language model training on MiniPile with recurrent linear-time attention' documentation.url=https://github.com/BlinkDL/RWKV-LM/tree/main/RWKV-v7/train_temp
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar status --untracked-dirs
    roar put RWKV-v7/train_temp/out/L12-D768-x070/rwkv-final.pth hf://reproducible-ai/rwkv-7-minipile --public --yes --no-tag -m "RWKV-7 MiniPile capture truncated to one miniepoch; no convergence claim"
  trace: off
