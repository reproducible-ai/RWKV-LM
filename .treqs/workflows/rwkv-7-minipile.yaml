name: rwkv-7-minipile reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    rm -rf *.egg-info src/*.egg-info
    if command -v uv >/dev/null 2>&1; then
      test "$(uv --version | awk '{print $1, $2}')" = "uv 0.12.3"
      echo UV_SOURCE=baked
    else
      curl -fsSL -o /tmp/uv-campaign.tar.gz \
        https://github.com/astral-sh/uv/releases/download/0.12.3/uv-x86_64-unknown-linux-gnu.tar.gz
      echo "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101  /tmp/uv-campaign.tar.gz" | sha256sum -c -
      tar -xzf /tmp/uv-campaign.tar.gz -C /tmp
      sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
      test "$(/usr/local/bin/uv --version | awk '{print $1, $2}')" = "uv 0.12.3"
      echo UV_SOURCE=bootstrapped
    fi
    /usr/local/bin/uv venv --python /opt/pytorch/bin/python /opt/workloads/rwkv-7-minipile
    test -f /opt/workloads/rwkv-7-minipile/pyvenv.cfg
    grep -qx 'include-system-site-packages = false' /opt/workloads/rwkv-7-minipile/pyvenv.cfg
    /usr/local/bin/uv pip install --python /opt/workloads/rwkv-7-minipile/bin/python torch==2.7.1 pytorch-lightning==1.9.5 deepspeed==0.17.6 wandb==0.21.1 trackio==0.37.0 ninja==1.13.0 numpy==1.26.4 requests==2.32.5 setuptools==80.9.0
    env PATH=/usr/local/bin:/usr/bin:/bin roar --version
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

download_minipile:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/workloads/rwkv-7-minipile/bin:$PATH

    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n download_minipile --wandb-to-trackio -- env TRACKIO_SPACE_ID=reproducible-ai/experiments python RWKV-v7/train_temp/download_minipile.py
  trace: off

initialize:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/workloads/rwkv-7-minipile/bin:$PATH

    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n initialize --wandb-to-trackio -- env -C RWKV-v7/train_temp TRACKIO_SPACE_ID=reproducible-ai/experiments python train.py --wandb '' --proj_dir out/L12-D768-x070 --data_file data/minipile --data_type binidx --vocab_size 65536 --my_testing x070 --ctx_len 512 --train_stage 1 --epoch_count 1 --epoch_begin 0 --epoch_save 1 --weight_decay 0 --head_size 64 --num_nodes 1 --micro_bsz 1 --n_layer 12 --n_embd 768 --my_exit_tokens 1498226207 --magic_prime 2926181 --lr_init 1e-5 --lr_final 1e-5 --warmup_steps 10 --beta1 0.9 --beta2 0.99 --adam_eps 1e-8 --accelerator cpu --devices 1 --precision bf16 --strategy deepspeed_stage_2 --grad_cp 1
  trace: off

train_two_steps:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PATH=/opt/workloads/rwkv-7-minipile/bin:$PATH

    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n train_two_steps --wandb-to-trackio -- env -C RWKV-v7/train_temp TRACKIO_SPACE_ID=reproducible-ai/experiments python train.py --load_model 0 --wandb rwkv-7-minipile --proj_dir out/L12-D768-x070 --my_testing x070 --ctx_len 512 --train_stage 3 --epoch_count 999999 --epoch_begin 0 --data_file data/minipile --my_exit_tokens 16384 --magic_prime 2926181 --num_nodes 1 --micro_bsz 16 --n_layer 12 --n_embd 768 --kernel @rwkv3 --lr_init 6e-4 --lr_final 6e-5 --warmup_steps 10 --beta1 0.9 --beta2 0.99 --adam_eps 1e-18 --data_type binidx --vocab_size 65536 --weight_decay 0.001 --epoch_save 10 --head_size 64 --head_chunk 0 --accelerator gpu --devices 1 --precision bf16 --strategy deepspeed_stage_2 --grad_cp 1 --enable_progress_bar True
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact RWKV-v7/train_temp/out/L12-D768-x070/rwkv-final.pth model.name=rwkv-7-minipile model.version=7 license.id=Apache-2.0 license.name='Apache License 2.0' description='RWKV-7 language model pretraining on MiniPile, truncated after two optimizer steps.' documentation.url=https://github.com/BlinkDL/RWKV-LM/tree/658042ca30222715c1d3ab662a3c556824dc6618/RWKV-v7/train_temp
  trace: off

publish:
  # Publish this step's artifact under the project's identity, not anonymously.
  glaas_creds: true
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar status --untracked-dirs
    roar put RWKV-v7/train_temp/out/L12-D768-x070/rwkv-final.pth hf://reproducible-ai/rwkv-7-minipile --public --yes --no-tag -m "Truncated RWKV-7 MiniPile training after two optimizer steps; no convergence claim."
  trace: off
